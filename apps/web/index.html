    <meta charset="UTF-8" />

    <meta name="description" content="Organize finanças, saúde, agenda e registros pessoais em um só lugar." />
    <title>Assistente Pessoal</title>
    <script>
      try {
        const t = localStorage.getItem('tema')
        if (t === 'escuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
